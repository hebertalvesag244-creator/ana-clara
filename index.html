<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para Ana Clara ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #12000a;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 30px 20px;
        }

        h1 {
            color: #ff4d88;
            font-size: clamp(35px, 10vw, 90px);
            margin: 0;
            text-shadow: 0 0 20px #ff1764;
        }

        .mensagem {
            margin: 30px auto;
            max-width: 650px;

            font-size: clamp(18px, 4vw, 28px);
            line-height: 1.5;

            color: #ffffff;
        }

        .coracao {
            font-size: 100px;
            animation: pulsar 1s infinite;
            margin: 20px;
        }

        .final {
            margin-top: 30px;
            font-size: clamp(24px, 6vw, 45px);
            color: #ff4d88;
            font-weight: bold;
        }

        .assinatura {
            margin-top: 20px;
            color: #ffd1df;
            font-size: 18px;
        }

        @keyframes pulsar {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        .entrada {
            animation: aparecer 2s ease;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container entrada">

        <h1>ANA CLARA</h1>

        <div class="mensagem">
            Amar é escolher alguém todos os dias,
            mesmo quando o tempo muda tudo ao nosso redor.
        </div>

        <div class="coracao">
            ❤️
        </div>

        <div class="final">
            EU TE AMO, ANA CLARA ❤️
        </div>

        <div class="assinatura">
            Feito especialmente para você.
        </div>

    </div>

</body>

</html>
