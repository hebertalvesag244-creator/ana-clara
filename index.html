<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para Ana Clara ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #12001f, #3b0754, #12001f);
            color: white;
            text-align: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* TELA INICIAL */

        .tela-inicial {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .tela-inicial h1 {
            font-size: 45px;
            margin-bottom: 10px;
            color: #ff8bdc;
        }

        .tela-inicial p {
            font-size: 18px;
            color: #eee;
        }

        button {
            border: none;
            padding: 15px 25px;
            border-radius: 30px;
            background: #ff4fa3;
            color: white;
            font-size: 17px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 0 20px #ff4fa3;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }

        /* PRESENTE */

        .presente {
            display: none;
            padding: 35px 20px;
            max-width: 900px;
            margin: auto;
        }

        .coracao {
            font-size: 75px;
            animation: pulsar 1.3s infinite;
        }

        @keyframes pulsar {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
            }
        }

        h2 {
            color: #ff8bdc;
            font-size: 32px;
        }

        /* CONTADOR */

        .contador {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 25px auto;
        }

        .tempo {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            padding: 12px;
            min-width: 90px;
        }

        .tempo strong {
            display: block;
            font-size: 25px;
            color: #ff8bdc;
        }

        .tempo span {
            font-size: 11px;
            color: #ddd;
        }

        /* MÚSICA */

        .musica {
            margin: 25px 0;
        }

        .musica p {
            color: #ddd;
        }

        /* FOTO */

        .galeria {
            margin-top: 40px;
        }

        .galeria h2 {
            margin-bottom: 20px;
        }

        .foto-container {
            display: flex;
            justify-content: center;
            padding: 10px;
        }

        .foto-container img {
            width: 100%;
            max-width: 600px;
            max-height: 650px;
            object-fit: cover;
            border-radius: 22px;
            border: 3px solid rgba(255,255,255,0.3);
            box-shadow:
                0 0 25px rgba(255,79,163,0.4),
                0 15px 40px rgba(0,0,0,0.5);
            transition: 0.4s;
        }

        .foto-container img:hover {
            transform: scale(1.02);
        }

        /* CARTA */

        .carta {
            background: rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 25px;
            margin-top: 35px;
            line-height: 1.8;
            font-size: 17px;
            text-align: left;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* FINAL */

        .final {
            margin-top: 50px;
            padding-bottom: 50px;
        }

        .final h1 {
            font-size: 45px;
            color: #ff6fbd;
            animation: pulsar 1.5s infinite;
        }

        /* CORAÇÕES FLUTUANTES */

        .coracao-flutuante {
            position: fixed;
            bottom: -30px;
            font-size: 25px;
            animation: subir 6s linear forwards;
            pointer-events: none;
            z-index: 999;
        }

        @keyframes subir {
            from {
                transform: translateY(0);
                opacity: 1;
            }

            to {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }

        /* CELULAR */

        @media (max-width: 600px) {

            .tela-inicial h1 {
                font-size: 36px;
            }

            .presente {
                padding: 30px 15px;
            }

            h2 {
                font-size: 27px;
            }

            .foto-container img {
                max-height: 500px;
            }

            .final h1 {
                font-size: 35px;
            }

            .tempo {
                min-width: 85px;
            }
        }

    </style>
</head>

<body>

    <!-- TELA INICIAL -->

    <div class="tela-inicial" id="inicio">

        <div class="coracao">

        </p>

        <button onclick="abrirPresente()">

        </button>

    </div>


    <!-- PRESENTE -->

    <div class="presente" id="presente">

        <h2>

        </h2>

        <p>

        </p>

        <div class="contador">

            <div class="tempo">
                <strong id="anos">0</strong>
                <span>ANOS</span>
            </div>

            <div class="tempo">
                <strong id="meses">0</strong>
                <span>MESES</span>
            </div>

            <div class="tempo">
                <strong id="dias">0</strong>
                <span>DIAS</span>
            </div>

            <div class="tempo">
                <strong id="horas">0</strong>
                <span>HORAS</span>
            </div>

            <div class="tempo">
                <strong id="minutos">0</strong>
                <span>MINUTOS</span>
            </div>

            <div class="tempo">
                <strong id="segundos">0</strong>

            </div>
